<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aegis Gate — HUD preview</title>
  <style>
    :root {
      --bg: #070b14;
      --scrim: rgba(6, 10, 18, 0.78);
      --glass: rgba(12, 18, 32, 0.82);
      --fg: #e8eefc;
      --accent: #7dd3fc;
      --go: #3DDC97;
      --hold: #F5A524;
      --no: #FF4D6D;
      --muted: #8B93A7;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #04070d; color: var(--fg); font-family: "IBM Plex Sans", "Segoe UI", sans-serif; }
    body { display: grid; grid-template-rows: auto 1fr; }
    .toolbar {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
      padding: 12px 16px; background: #0b1220; border-bottom: 1px solid #1c2740;
      font-size: 13px;
    }
    button, .chip {
      border: 1px solid #2a3a58; background: #121a2c; color: var(--fg);
      border-radius: 999px; padding: 6px 12px; cursor: pointer;
    }
    button.active { border-color: var(--accent); color: var(--accent); }
    .stage { position: relative; overflow: hidden; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .honesty {
      position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; align-items: center;
      background: rgba(12, 18, 32, 0.8); border: 1px solid rgba(125, 211, 252, 0.55);
      border-radius: 999px; padding: 8px 14px; font-size: 12px; letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .honesty .mode {
      border-radius: 999px; padding: 2px 10px; font-weight: 700; letter-spacing: 0.14em;
      border: 1px solid;
    }
    .core {
      position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%);
      width: min(560px, 56vw); background: var(--glass);
      border: 1px solid rgba(245, 165, 36, 0.45); border-radius: 28px;
      padding: 28px; text-align: center;
    }
    .brand { color: var(--accent); letter-spacing: 0.28em; font-size: 12px; font-weight: 700; }
    h1 { margin: 10px 0 8px; font-size: 28px; }
    .reason { opacity: 0.72; margin: 0 0 14px; }
    .risks { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .risk {
      border-radius: 999px; padding: 4px 10px; font-size: 12px;
      background: rgba(245, 165, 36, 0.12); border: 1px solid rgba(245, 165, 36, 0.45);
    }
    .rec { margin-top: 12px; font-size: 12px; letter-spacing: 0.08em; }
    .pillars {
      position: absolute; left: 50%; bottom: 88px; transform: translateX(-50%);
      display: flex; gap: 18px;
    }
    .pillar {
      width: min(180px, 20vw); height: 148px; border-radius: 18px;
      background: rgba(12, 18, 32, 0.55); border: 1px solid rgba(255,255,255,0.12);
      text-align: center; padding-top: 18px; cursor: pointer;
    }
    .pillar.on { transform: scale(1.04); background: rgba(12, 18, 32, 0.78); }
    .pillar.pulse { transform: scale(1.1); box-shadow: 0 0 32px currentColor; }
    .pillar .cap { height: 6px; margin: -18px -1px 16px; border-radius: 3px 3px 0 0; }
    .pillar h2 { margin: 0; letter-spacing: 0.18em; }
    .hint, .key, .footer { opacity: 0.5; font-size: 12px; }
    .footer {
      position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <strong>Aegis Gate preview</strong>
    <button data-scene="demo">DEMO HOLD</button>
    <button data-scene="live">LIVE HOLD</button>
    <button data-scene="go">LIVE GO</button>
    <button data-scene="no">LIVE NO</button>
    <button data-scene="partial">no verdict</button>
    <button id="confirm">Enter confirm</button>
    <span id="status"></span>
  </div>
  <div class="stage" id="stage">
    <canvas id="field"></canvas>
    <div class="honesty" id="honesty"></div>
    <div class="core" id="core"></div>
    <div class="pillars" id="pillars"></div>
    <div class="footer" id="footer">ESC close · 1/G GO · 2/H HOLD · 3/N NO · ENTER confirm</div>
  </div>
  <script>
    const scenes = {
      demo: { live: false, decision: "HOLD", title: "Deploy to staging?", reason: "Sample HOLD for the DEMO airlock. Not a live agent, tool, or deploy gate.", risks: ["unreviewed diff", "weekend window", "no rollback drill"], honesty: "DEMO gate · not a live agent · HUD does not block tools", rec: "DEMO sample HOLD" },
      live: { live: true, decision: "HOLD", title: "Deploy to prod?", reason: "Migration has no rollback", risks: ["prod write", "no canary"], honesty: "LIVE payload · manual summon · manual HUD, not an agent bridge", rec: "payload HOLD" },
      go: { live: true, decision: "GO", title: "Lint the README?", reason: "Docs-only local check from a summon payload.", risks: ["docs only"], honesty: "LIVE payload · shell summon · manual HUD, not an agent bridge", rec: "payload GO" },
      no: { live: true, decision: "NO", title: "Wipe /var/lib?", reason: "Irreversible. The HUD is displaying a summoned NO — it is not blocking a tool.", risks: ["irreversible", "production data"], honesty: "LIVE payload · summoned as hermes · manual HUD, not an agent bridge", rec: "payload NO" },
      partial: { live: false, decision: "", title: "Ship it", reason: "Title and reason only. No decision field, so no invented verdict.", risks: [], honesty: "DEMO gate · not a live agent · HUD does not block tools", rec: "no verdict in payload" }
    };
    const colors = { GO: "#3DDC97", HOLD: "#F5A524", NO: "#FF4D6D" };
    let current = "demo";
    let selected = "HOLD";
    let pulse = 0;

    function render(name) {
      current = name;
      const g = scenes[name];
      selected = g.decision || "HOLD";
      pulse = 0;
      document.querySelectorAll(".toolbar button[data-scene]").forEach((b) => b.classList.toggle("active", b.dataset.scene === name));
      document.getElementById("honesty").innerHTML = `<span class="mode" style="color:${g.live ? "var(--hold)" : "var(--accent)"};border-color:currentColor;background:${g.live ? "rgba(245,165,36,.28)" : "rgba(125,211,252,.16)"}">${g.live ? "LIVE" : "DEMO"}</span><span>${g.honesty}</span>`;
      document.getElementById("core").innerHTML = `<div class="brand">AEGIS GATE</div><h1>${g.title}</h1><p class="reason">${g.reason}</p><div class="risks">${g.risks.map((r) => `<span class="risk">${r}</span>`).join("")}</div><div class="rec" style="color:${colors[selected] || "var(--muted)"}">${g.rec}</div>`;
      document.getElementById("pillars").innerHTML = ["GO","HOLD","NO"].map((id) => {
        const on = id === selected;
        return `<div class="pillar ${on ? "on" : ""}" data-id="${id}" style="color:${colors[id]};border-color:${on ? colors[id] : "rgba(255,255,255,.12)"}"><div class="cap" style="background:${colors[id]}"></div><h2>${id}</h2><div class="hint">${id === "GO" ? "proceed" : id === "HOLD" ? "review" : "refuse"}</div><div class="key">${id === "GO" ? "1 / G" : id === "HOLD" ? "2 / H" : "3 / N"}</div></div>`;
      }).join("");
      document.getElementById("status").textContent = g.live ? "PENDING 1 (live)" : "PENDING 0 (demo)";
      paint();
    }

    function paint() {
      const canvas = document.getElementById("field");
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * devicePixelRatio;
      canvas.height = rect.height * devicePixelRatio;
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height, cx = w * 0.5, cy = h * 0.38, maxR = Math.min(w, h) * 0.34;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "rgba(6,10,18,0.72)";
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = "rgba(125,211,252,0.08)";
      for (let i = 0; i < 12; i++) {
        ctx.beginPath();
        ctx.moveTo(0, h * 0.08 + i * 48);
        ctx.lineTo(w, h * 0.02 + i * 48);
        ctx.stroke();
      }
      function hex(r, a) {
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const ang = Math.PI / 6 + i * Math.PI / 3;
          const x = cx + r * Math.cos(ang), y = cy + r * Math.sin(ang);
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.closePath();
        ctx.strokeStyle = `rgba(125,211,252,${a})`;
        ctx.stroke();
      }
      hex(maxR * 1.08, 0.16); hex(maxR * 0.82, 0.32); hex(maxR * 0.58, 0.12);
      const arcs = [{ id: "GO", c: colors.GO, s: -Math.PI * 0.5 }, { id: "HOLD", c: colors.HOLD, s: Math.PI * 0.1667 }, { id: "NO", c: colors.NO, s: Math.PI * 0.8333 }];
      arcs.forEach((arc) => {
        const on = arc.id === selected;
        ctx.beginPath();
        ctx.lineWidth = on ? 8 + pulse * 6 : 3;
        ctx.strokeStyle = arc.c;
        ctx.globalAlpha = on ? 0.9 : 0.28;
        ctx.arc(cx, cy, maxR * 0.94, arc.s + 0.08, arc.s + Math.PI * 0.666 - 0.08);
        ctx.stroke();
        ctx.globalAlpha = 1;
      });
    }

    document.querySelectorAll("[data-scene]").forEach((b) => b.addEventListener("click", () => render(b.dataset.scene)));
    document.getElementById("confirm").addEventListener("click", () => {
      pulse = 1;
      document.querySelectorAll(".pillar").forEach((p) => p.classList.toggle("pulse", p.dataset.id === selected));
      document.getElementById("status").textContent = "receipt · ~/.local/share/smf-aegis-gate/receipts.jsonl";
      document.getElementById("footer").textContent = "receipt · ~/.local/share/smf-aegis-gate/receipts.jsonl";
      paint();
    });
    window.addEventListener("resize", paint);
    render("demo");
  </script>
</body>
</html>
